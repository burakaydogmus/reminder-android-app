name: iOS build

# macOS runners bill 10x on private repos (~35 billed minutes per run).
# Runs only when iOS config or dependencies change; start it manually from the
# Actions tab when a Dart-only change needs an iOS check.
on:
  pull_request:
    branches: [master]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-ios:
    name: Build iOS (no codesign)
    # Pinned so a future macos-latest move (Xcode 27) does not change the build.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --no-codesign --debug

      # F5.2: the WidgetKit extension is only ever compiled here (no Mac in the
      # dev environment). A green `flutter build` alone would not prove the
      # extension was built and embedded, so assert the .appex and its
      # localizations are inside the app bundle.
      - name: Verify the widget extension is embedded
        run: |
          appex="build/ios/iphoneos/Runner.app/PlugIns/ReminderWidgetExtension.appex"
          if [ ! -d "$appex" ]; then
            echo "::error::$appex is missing — the F5.2 widget extension was not built or not embedded"
            exit 1
          fi
          test -f "$appex/ReminderWidgetExtension" \
            || { echo "::error::the extension binary is missing"; exit 1; }
          for lproj in tr en; do
            test -f "$appex/$lproj.lproj/Localizable.strings" \
              || { echo "::error::$lproj.lproj/Localizable.strings is missing"; exit 1; }
          done
          point=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")
          test "$point" = "com.apple.widgetkit-extension" \
            || { echo "::error::unexpected extension point: $point"; exit 1; }
          echo "Embedded $(du -sh "$appex" | cut -f1) widget extension:"
          find "$appex" -maxdepth 2 | sort
