name: Release APK

# Publishes a signed APK as a GitHub Release so the owner's phone can update
# itself (Obtainium or any GitHub-release updater watches the repo; see
# docs/updates.md). Two things make that work and are easy to break:
#
# 1. A *rising* versionCode. `pubspec.yaml` pins `+8`, so every CI build used
#    to produce the same versionCode and no updater could tell two builds
#    apart. Here it is `date -u +%y%m%d%H` (e.g. 26092618), which rises with
#    time, survives workflow renames (unlike `github.run_number`) and stays
#    far below Android's 2100000000 limit until the year 2099. Two builds in
#    the same UTC hour share a number; rerun the next hour if that matters.
# 2. Stable asset names (`reminder-arm64-v8a.apk`), because the updater
#    matches the asset by name.
#
# Run it from Actions → Release APK → Run workflow, on master.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Extra release notes (optional, prepended)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  release:
    name: Build and publish a signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release notes can name the commits since the
          # previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Unlike the Android CI job, a release must NOT fall back to the debug
      # key: a debug-signed APK cannot install over the owner's copy, and a
      # published release that silently cannot be installed is worse than no
      # release at all.
      - name: Require the signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see docs/android-signing.md"
            exit 1
          fi

      - name: Write the signing config
        run: |
          keystore="$RUNNER_TEMP/reminder-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-reminder}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Compute the version
        id: version
        run: |
          name=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)
          number=$(date -u +%y%m%d%H)
          test -n "$name" || { echo "::error::could not read version from pubspec.yaml"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "tag=v$name+$number" >> "$GITHUB_OUTPUT"
          echo "Version $name (build $number)"

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name '${{ steps.version.outputs.name }}' \
            --build-number '${{ steps.version.outputs.number }}'

      # Stable names, because the updater on the phone matches assets by name.
      - name: Collect and verify the APKs
        id: apks
        run: |
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "release/reminder-$abi.apk"
          done
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in release/*.apk; do
            echo "── $(basename "$apk") ($(du -h "$apk" | cut -f1))"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs" | grep -E 'certificate DN|SHA-256 digest'
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk carries the debug signature — it could not be installed as an update"
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          previous=$(git tag --sort=-creatordate | grep '^v' | head -1 || true)
          {
            if [ -n "$EXTRA_NOTES" ]; then printf '%s\n\n' "$EXTRA_NOTES"; fi
            echo "Kişisel kullanım için imzalı derleme · \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Telefonuna **reminder-arm64-v8a.apk** kur (diğerleri eski cihazlar ve emülatör için)."
            echo "Otomatik güncelleme kurulumu: [docs/updates.md](../blob/master/docs/updates.md)"
            if [ -n "$previous" ]; then
              echo
              echo "### $previous sürümünden bu yana"
              echo
              git log --no-merges --pretty='- %s' "$previous..HEAD" | head -50
            fi
          } > notes.md
          gh release create "$tag" release/*.apk \
            --title "$tag" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          echo "Released $tag"
