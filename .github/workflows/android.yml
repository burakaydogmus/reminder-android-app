name: Android build

# Release APK (R8 + resource shrinking) also proves the app compiles, so no
# separate debug build. Runs only when Android config or dependencies change;
# start it manually (Actions tab → Android build → Run workflow) to get an APK.
on:
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build-android-release:
    name: Build Android (release APK, R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional personal signing key (docs/android-signing.md). When the
      # secrets are absent the build still works and Gradle falls back to the
      # debug key — but a debug key is generated per runner, so consecutive
      # APKs have different signatures and Android refuses to install one over
      # the other (uninstall = data loss). With the secrets set, every APK is
      # an update over the last one.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `android/app/build.gradle` picks signingConfigs.release as soon as
      # android/key.properties exists (and warns and falls back to the debug
      # key when it does not), so writing the file is all CI has to do.
      - name: Write the signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keystore="$RUNNER_TEMP/reminder-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          # An absolute path: Gradle resolves a relative storeFile against
          # android/app, not android/.
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-reminder}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      # --split-per-abi: one APK per architecture (~25 MB) instead of one fat
      # 76 MB APK carrying all three. A phone only ever runs one of them, and
      # these builds are downloaded by hand from the run's artifacts.
      #
      # Flutter gives each split a versionCode offset (armeabi-v7a +1000,
      # arm64-v8a +2000, x86_64 +3000), so switching a device from the fat APK
      # to a split is an upgrade, but going back is a downgrade Android blocks.
      # Pick one variant per device and stay on it (docs/android-signing.md).
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      # Which key actually signed it, and that the signature verifies at all.
      # `apksigner`, not `keytool -printcert -jarfile`: minSdk 26 means AGP
      # signs with APK Signature Scheme v2/v3 only, and keytool can read just
      # the old v1 (JAR) signature, so it silently prints nothing.
      #
      # A debug-signed APK shows "CN=Android Debug"; the personal key shows its
      # own DN, and the printed SHA-256 should match
      # `apksigner verify --print-certs` (or `keytool -list -v`) on the local
      # keystore. With the secret set, a debug signature means the signing step
      # did not take effect, so fail instead of shipping an APK that cannot be
      # installed over the previous one.
      - name: Show the APK signer
        run: |
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "── $(basename "$apk") ($(du -h "$apk" | cut -f1))"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs" | grep -E 'certificate DN|SHA-256 digest'
            if [ -n "$KEYSTORE_BASE64" ] && echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key even though ANDROID_KEYSTORE_BASE64 is set"
              exit 1
            fi
          done

      # arm64-v8a on its own: every phone made since ~2016 runs it, so this is
      # the one artifact worth downloading. The other two are a separate
      # artifact so a ~25 MB download does not carry them along.
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ env.KEYSTORE_BASE64 != ''
                && 'app-release-arm64-apk'
                || 'app-release-arm64-debugsigned-apk' }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      # armeabi-v7a (pre-2016 phones) and x86_64 (emulators).
      - name: Upload APK (other ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ env.KEYSTORE_BASE64 != ''
                && 'app-release-other-abis-apk'
                || 'app-release-other-abis-debugsigned-apk' }}
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7
