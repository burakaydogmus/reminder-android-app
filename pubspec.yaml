name: reminder
description: Genel hatırlatıcı — yapılacaklar ve notlar.
publish_to: 'none'
version: 2.1.0+8

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino widgets and their localization delegates.
  material_ui: ^1.2.0
  # F6.1: the gen-l10n output (lib/l10n/app_localizations.dart) imports
  # flutter_localizations (material_ui depends on it too).
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.0.2
  cupertino_icons: ^1.0.9
  animations: ^3.0.0
  flutter_bloc: ^8.1.6
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # 13.x needs compileSdk 37 (permission_handler_android 14); stay on 12.x
  # while Flutter's default compileSdk is 36.
  permission_handler: ^12.0.3
  geolocator: ^14.0.3
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  home_widget: ^0.9.4
  # F5.3: app icon shortcuts (Android launcher shortcuts, iOS Home Screen
  # quick actions); flutter.dev, no manifest/Info.plist entries.
  quick_actions: ^1.1.1
  native_geofence: ^1.3.1
  # Storage (F2.1). sqlite3 3.x bundles SQLite through build hooks, so no
  # sqlite3_flutter_libs dependency is needed.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0
  path_provider: ^2.1.6
  # Backup (F2.2): system share sheet for the export file, document picker
  # for import (flutter.dev; no manifest/Info.plist entries), app version in
  # the backup header.
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1
  # iOS glass chrome (F5.4): tab bar and search button only; solid fallback
  # under Reduce Transparency / Increase Contrast / low power. MIT, no deps.
  liquid_glass_widgets: ^1.5.0
  # F6.2b: privacy policy and OSM copyright links in the browser (launchUrl
  # only, no canLaunchUrl, so no <queries>/LSApplicationQueriesSchemes).
  url_launcher: ^6.3.2
  # F8.1: read-only device calendar events. `device_calendar` (the usual
  # choice) cannot be used here — 4.x pins `timezone ^0.9.0` against our
  # ^0.11.1 (flutter_local_notifications 22) and its Android module still does
  # `apply plugin: 'kotlin-android'` with compileSdk 34, which AGP 9 rejects;
  # 3.9.0 resolves but is Dart 2 only, has no `namespace` and pins AGP 3.4.2.
  # device_calendar_plus is the maintained federated replacement: no Dart
  # dependencies of its own (so no timezone clash), built-in Kotlin,
  # compileSdk 36 / minSdk 24, iOS 13, and the iOS 17 EventKit access API.
  # Only its read side is used (listCalendars / listEvents / showEventModal);
  # see CLAUDE.md › Device calendar (F8.1).
  device_calendar_plus: ^0.9.0
  # F7.3: one-shot, read-only contacts import for birthdays. quis.co, 1.0+
  # (2.5.0), 160/160 pub points, ~288k downloads/30 days, and **no Dart
  # dependencies of its own**, so nothing can clash with our timezone/intl
  # pins. `Event.year` is nullable, which is what lets a year-less contact
  # birthday import as `Birthday.year == null` instead of a sentinel.
  # `fast_contacts` was rejected: its `Contact` exposes only phones, e-mails,
  # the structured name and the organization — it cannot read birthdays at all.
  # flutter_contacts' Android module declares **no permissions** in its own
  # manifest, so the merged manifest stays READ_CONTACTS-only; compileSdk 36 /
  # minSdk 24, built-in Kotlin, iOS 13. Only `getAll` with
  # `ContactProperty.event` is used; see CLAUDE.md › Contacts import (F7.3).
  flutter_contacts: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Emulator/device end-to-end tests (integration_test/). Never used by the
  # host suite under test/; see CLAUDE.md -> End-to-end tests.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  bloc_test: ^9.1.7
  mocktail: ^1.0.5
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter_launcher_icons:
  image_path: assets/launcher/icon.png
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#6B4FC8"
  adaptive_icon_foreground: assets/launcher/icon.png

flutter:

  uses-material-design: true
  # F6.1: gen-l10n (l10n.yaml) runs on pub get and builds.
  generate: true

  assets:
    - assets/launcher/icon.png
    # Shown on the Lisanslar page (LicenseRegistry, lib/config/app_licenses.dart).
    - fonts/GoogleSansFlex/OFL.txt
    - assets/licenses/

  fonts:
    # Kor theme: variable font, axes wght/opsz/ROND, latin+latin-ext.
    # License: fonts/GoogleSansFlex/OFL.txt
    - family: GoogleSansFlex
      fonts:
        - asset: fonts/GoogleSansFlex/GoogleSansFlex-Latin.ttf
