org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Same as the Flutter 3.47 app template. Flutter's migrator adds both flags
# when they are missing. Built-in Kotlin stays off until every plugin stops
# applying kotlin-android itself; the Flutter Gradle plugin applies KGP.
android.newDsl=false
android.builtInKotlin=false
# AGP 9's optimized (R8-integrated) resource shrinking requires non-final
# resource IDs, which conflicts with android.nonFinalResIds=false above.
# Use the classic shrinkResources path until the template flags change.
android.r8.optimizedResourceShrinking=false
